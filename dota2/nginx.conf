# React Web 同源生产站点模板。
# __WEB_ROOT__ 由 publish-release.zsh 在不可变 release 目录内渲染。
# 本文件作为 http{} 内的 include 使用；map/log_format 不能放进 server{}。

# 只接受合法 UUID request id，非法或缺失值用 Nginx 的 32 位随机值
# 重新排布为 UUID v4 形状，再交给 Rust 传播。这样静态错误和 upstream
# 响应都能返回同一个合法 request ID，而不是把 Nginx 的纯十六进制值暴露给客户端。
map $request_id $generated_request_id {
    ~^(?<dota_req_a>[0-9A-Fa-f]{8})(?<dota_req_b>[0-9A-Fa-f]{4})[0-9A-Fa-f](?<dota_req_c>[0-9A-Fa-f]{3})[0-9A-Fa-f](?<dota_req_d>[0-9A-Fa-f]{3})(?<dota_req_e>[0-9A-Fa-f]{12})$ $dota_req_a-$dota_req_b-4$dota_req_c-8$dota_req_d-$dota_req_e;
    default $request_id;
}

map $http_x_request_id $upstream_request_id {
    default $generated_request_id;
    ~^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-5][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$ $http_x_request_id;
}

# 与 contracts 中标记为 processing/heavy 的 endpoint 对齐，避免普通 API
# 的 30s 超时把可轮询的长任务误判成网关失败。
map $uri $api_proxy_timeout {
    default 30s;
    ~^/api/(draft/(analyze|v2/analyze|sequence/predict)|research/similar-matches/search|matches/[0-9]+/refresh|players/[0-9]+/(refresh|training-plan/refresh)|admin/meta/backtests(/.*)?|admin/win-probability/(train|runs/[^/]+/cancel))$ 120s;
}

# 严禁使用包含 query 的 request target 变量，避免 owner_key 写入 access log。
log_format dota_meta_web '$upstream_request_id $status $request_method $uri $server_protocol '
                         'request_time=$request_time bytes=$body_bytes_sent';

server {
    listen 80;
    server_name _;
    root __WEB_ROOT__;
    index index.html;

    access_log /var/log/nginx/dota-meta-web.access.log dota_meta_web;
    # request target 只允许出现在 access log 的 $uri；较低级别的 Nginx
    # error log 可能把带 legacy owner_key 的完整 URL 写入日志。
    error_log /var/log/nginx/dota-meta-web.error.log crit;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-4shpCne9xRE7+7BQRKYUnOrU92vXxJKol+rWAKk2YzY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
    add_header X-Frame-Options 'DENY' always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()' always;
    add_header X-Request-ID $upstream_request_id always;

    gzip on;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    location = /api {
        default_type application/json;
        return 404 '{"detail":"route not found","error":{"code":"route_not_found","message":"route not found"}}';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $upstream_request_id;
        proxy_set_header X-Dota-Meta-Client $http_x_dota_meta_client;
        proxy_set_header X-Owner-Key $http_x_owner_key;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 5s;
        # processing/heavy endpoint 由 map 单独提升到 120s；普通 GET 固定 30s。
        proxy_read_timeout $api_proxy_timeout;
        proxy_send_timeout $api_proxy_timeout;
        # 不截断 Rust 自己的 502/504 envelope；error_page 只处理 Nginx 无法到达 upstream 的错误。
        error_page 502 = @api_bad_gateway;
        error_page 504 = @api_gateway_timeout;
    }

    location @api_bad_gateway {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-4shpCne9xRE7+7BQRKYUnOrU92vXxJKol+rWAKk2YzY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()' always;
        add_header X-Request-ID $upstream_request_id always;
        return 502 '{"detail":"upstream unavailable","error":{"code":"upstream_unavailable","message":"upstream service unavailable"}}';
    }

    location @api_gateway_timeout {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-4shpCne9xRE7+7BQRKYUnOrU92vXxJKol+rWAKk2YzY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()' always;
        add_header X-Request-ID $upstream_request_id always;
        return 504 '{"detail":"upstream timeout","error":{"code":"gateway_timeout","message":"upstream service timed out"}}';
    }

    location /assets/ {
        try_files $uri =404;
        # 由显式 Cache-Control 统一输出，避免 expires 额外产生第二个 header。
        expires off;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-4shpCne9xRE7+7BQRKYUnOrU92vXxJKol+rWAKk2YzY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header X-Content-Type-Options 'nosniff' always;
        add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
        add_header X-Frame-Options 'DENY' always;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()' always;
        add_header X-Request-ID $upstream_request_id always;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
    }

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # 只有文档请求可以走 SPA fallback；写请求不得被错误地返回 index.html。
    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        try_files $uri $uri/ /index.html;
    }

    error_page 405 = @web_method_not_allowed;
    location @web_method_not_allowed {
        default_type application/json;
        return 405 '{"detail":"method not allowed","error":{"code":"method_not_allowed","message":"method not allowed"}}';
    }
}
